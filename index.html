<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <link
      rel="shortcut icon"
      href="./src/img/lock_person_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <title>Tela de login</title>
  </head>
  <body>
    <main>
      <h1>Faça seu login</h1>
      <img
        src="./src/img/person_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"
        alt="Foto pessoal"
      />
      <section>
        <form action="">
          <div class="label-form">
            <label for="email">Email:</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="Digite seu email..."
            />
          </div>
          <div class="label-form">
            <label for="senha">Senha:</label>
            <input
              type="password"
              name="senha"
              id="senha"
              placeholder="Digite sua senha..."
            />
          </div>
          <button type="submit">Entrar</button>
        </form>
      </section>
      <p>Não tem conta? <a href="https://gabriel-fredo.github.io/Projeto_2_tela_criar_conta/">Crie sua conta</a></p>
    </main>
  </body>
</html>
